workflows:
  ios-app-store:
    name: ScoreCare iOS IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - firebase
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        NEXT_PUBLIC_API_BASE_URL: https://scorecareapp.com/api
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.scorecareapp.scorecare

    scripts:
      - name: Clean iOS build files
        script: |
          cd $CM_BUILD_DIR
          rm -rf ios/App/Pods
          rm -rf ios/App/Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build/ios

      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          npm ci

      - name: Create Firebase iOS config
        script: |
          cd $CM_BUILD_DIR
          test -n "$FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST"
          echo "$FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist

      - name: Build web app and sync Capacitor iOS
        script: |
          cd $CM_BUILD_DIR
          npm run ios:sync

      - name: Verify iOS UPI navigation fix
        script: |
          cd $CM_BUILD_DIR
          plutil -lint ios/App/App/Info.plist
          test -f ios/App/App/UpiNavigationPlugin.swift
          grep -q "UpiNavigationPlugin" ios/App/App/MainViewController.swift
          grep -q "UpiNavigationPlugin.swift in Sources" ios/App/App.xcodeproj/project.pbxproj
          grep -q "UIApplication.shared.open" ios/App/App/UpiNavigationPlugin.swift
          grep -q "NativeReportDownloadPlugin" ios/App/App/MainViewController.swift
          grep -q "NativeReportDownloadPlugin.swift in Sources" ios/App/App.xcodeproj/project.pbxproj

      - name: Install iOS pods
        script: |
          cd $CM_BUILD_DIR/ios/App
          pod install --repo-update

      - name: Apply iOS signing profiles
        script: |
          cd $CM_BUILD_DIR
          xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build App Store IPA
        script: |
          cd $CM_BUILD_DIR
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/Archives/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - avchamps1@gmail.com
        notify:
          success: true
          failure: true
