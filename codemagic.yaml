workflows:
  ios-app-store:
    name: ScoreCare iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        NEXT_PUBLIC_API_BASE_URL: https://scorecareapp.com/api
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.scorecare.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app and sync Capacitor iOS
        script: npm run ios:sync

      - name: Apply iOS signing profiles
        script: xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build App Store IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/Archives/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
